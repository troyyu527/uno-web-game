# Cloudflare Worker that backs accounts, cloud saves and online rooms.
# See README → "Server (Cloudflare)" for the one-time setup.

name = "uno-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Browser origins allowed to call the API (comma-separated). The GitHub Pages
# origin is the host only — no /uno-web-game/ path.
ALLOWED_ORIGINS = "https://troyyu527.github.io,http://localhost:5173,http://localhost:4173"

# Accounts + saves. Create it with `npx wrangler d1 create uno`, then paste the
# printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "uno"
database_id = "fbe6b361-5f35-4274-b8e0-09a6f9e91c12"

# One Durable Object per room: holds the room and its live WebSockets.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
